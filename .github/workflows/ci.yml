name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A run on any branch by hand, to measure a change to this file before it
  # reaches main. publish.yml reads only runs on a push to main.
  workflow_dispatch:

permissions:
  contents: read

# The suite is split across jobs so the wall clock is the longest job, not the
# sum. One job ran it all until v2.18.1, and took 2h07m on macOS (run
# 37256605251): the census alone was 72 minutes of v2.18.0's run, and
# effect-trace-grid waited for it. The groups and the census shards are named
# in scripts/test/run-all.sh and scripts/measure/scan-failure-census.sh; the
# verdict job checks that the jobs of one OS together ran everything that
# `npm run test:release` runs. Five jobs per OS, because GitHub runs at most
# five macOS jobs of an account at once and a sixth would wait for a free one.
# publish.yml's ci-green names every job below; a job added, removed or renamed
# here goes into its list in the same change, or the next release stops there.
jobs:
  batteries:
    name: batteries ${{ matrix.group }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # run-all.sh --group: a and b split the single-process batteries;
        # timing holds self-budget, effect-trace-grid and
        # install-dir-differential, which a busy machine turns red without a
        # defect; run-all.sh runs that group one battery at a time.
        group: [a, b, timing]
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      GITLEAKS_DARWIN_ARM64_SHA256: "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
    steps:
      # A security tool pins its own actions to a commit SHA (supply chain).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history so the dogfood secret scan covers every commit

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      # Every group installs gitleaks: group a's secret scan needs it, and so do
      # e2e's pre-commit gate rows in group b, which print `ok ... SKIPPED`
      # without it. Installed in group a alone, both OSes skipped those rows
      # (run 37297541785); the verdict job now fails on such a line.
      # Linux: download the pinned gitleaks release and verify its checksum before use.
      - name: Install gitleaks (Linux, checksum-verified)
        if: runner.os == 'Linux'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # macOS keeps the same pin + checksum posture as Linux (no mutable brew formula).
      # macos-latest is arm64; a non-arm64 runner would fail the checksum loudly.
      - name: Install gitleaks (macOS, checksum-verified)
        if: runner.os == 'macOS'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_DARWIN_ARM64_SHA256}  /tmp/gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # The static checks run once per OS, in group a, before its batteries.
      # The gate is bash-heavy; lint it for real bugs. The tree is error-clean;
      # the remaining shellcheck noise is unused-var and intentional-literal-tilde.
      - name: ShellCheck
        if: matrix.group == 'a' && runner.os == 'Linux'
        run: |
          shellcheck --version
          shellcheck --severity=error \
            bin/safedeps \
            lib/install-grammar.sh lib/gates/*.sh lib/ledger/*.sh lib/npm/*.sh lib/providers/*.sh \
            scripts/safedeps-pre-guard.sh scripts/safedeps-post-verify.sh \
            scripts/safedeps-recheck-alert.sh scripts/release-gates.sh \
            scripts/test/smoke.sh scripts/test/e2e.sh \
            scripts/test/run-all.sh scripts/test/ci-verdict.sh \
            scripts/measure/scan-failure-census.sh scripts/measure/census-shards.sh

      - name: Secret scan (dogfood, full history)
        if: matrix.group == 'a'
        run: ./bin/safedeps scan secrets --repo

      # Keep the zero-dependency security property honest, and catch stray files.
      - name: Verify package contents (Linux)
        if: matrix.group == 'a' && runner.os == 'Linux'
        run: |
          node -e "const d=require('./package.json').dependencies||{}; if(Object.keys(d).length){console.error('unexpected runtime deps:',Object.keys(d));process.exit(1)} console.log('zero runtime deps OK')"
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          if grep -Eq 'node_modules|/\.env|/\.git' /tmp/pack.txt; then echo "stray files in package"; exit 1; fi
          echo "package contents OK"

      - name: Test (run-all.sh --group ${{ matrix.group }})
        env:
          GROUP: ${{ matrix.group }}
          SAFEDEPS_TEST_LOG_DIR: ${{ runner.temp }}/batteries
        run: bash scripts/test/run-all.sh --group "$GROUP"

      # The verdict job reads which batteries ran from the .rc files here; the
      # logs ride along for reading a red run.
      - name: Upload the battery logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: batteries-${{ matrix.os }}-${{ matrix.group }}
          path: ${{ runner.temp }}/batteries
          retention-days: 14

  census:
    # The 2 here and in --shard below is the shard count; the verdict job
    # fails unless shards 1..M of one M all reported.
    name: census ${{ matrix.shard }}/2 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      # The runner is the census's alone, so it takes one guard per CPU rather
      # than the shared-machine default of half.
      - name: Census, quick, shard ${{ matrix.shard }}/2
        env:
          SHARD: ${{ matrix.shard }}
          OUT: ${{ runner.temp }}/census
        run: |
          bash scripts/measure/scan-failure-census.sh --quick --jobs "$(getconf _NPROCESSORS_ONLN)" \
            --shard "$SHARD/2" --out "$OUT"

      - name: Upload the shard's output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: census-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/census
          retention-days: 14

  verdict:
    name: verdict (${{ matrix.os }})
    needs: [batteries, census]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: batteries-${{ matrix.os }}-*
          path: ${{ runner.temp }}/verdict

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: census-${{ matrix.os }}-*
          path: ${{ runner.temp }}/verdict

      # Every battery with a CI group ran once and printed no skipped row the
      # verdict does not name, every census run was made once, and no census
      # failure mode was idle over all shards.
      - name: The jobs of ${{ matrix.os }} ran everything
        env:
          DIR: ${{ runner.temp }}/verdict
        run: bash scripts/test/ci-verdict.sh "$DIR"
