name: Publish

# Publishes to npm by trusted publishing (OIDC): no npm token exists anywhere,
# and npm attaches provenance. The npmjs.com side names this workflow by its
# filename, publish.yml, and the environment below; renaming either breaks
# publishing until the trusted publisher on npmjs.com is recreated to match.
# Release procedure: AGENTS.md, steps 5-10. The tag is pushed only after
# step 5's runs on our own hosts are green; this workflow does not wait for a
# CI run, because there is none on GitHub (owner, 2026-10-06).
#
# The package ships the Rust core as one binary per platform, under
# bin/native/<os>-<arch>/safedeps-core, and none of them is in git (owner,
# 2026-10-06): the `build` job builds them from the tagged source and the
# `publish` job packs them. The two jobs are apart so that the job that
# installs a toolchain holds no OIDC token: only `publish` can ask npm for a
# credential, and it runs no compiler.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # An arm64 Mac builds all three: the darwin binaries link against Apple's
    # SDK, which a Linux runner does not have, and the linux-x64 binary is a
    # static musl build linked with the linker the Rust toolchain ships, which
    # needs nothing of Linux on the runner.
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The toolchain is pinned here and nowhere else. rustup is on the
      # runner image; this fetches the compiler and the three targets'
      # standard libraries, and nothing after this step fetches anything.
      - name: Toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --no-self-update \
            --target aarch64-apple-darwin --target x86_64-apple-darwin --target x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=1.94.0" >> "$GITHUB_ENV"

      # scripts/build-core.sh is the one build, the same script a checkout
      # runs. It refuses a Cargo.lock that lists anything but the crate, and
      # builds --locked --offline, so a crate that would have to be fetched
      # fails the release here. --publish marks the binaries' stamp: they ship
      # without rust/, and do not look for a source to check themselves
      # against.
      - name: Build the binaries
        run: |
          set -euo pipefail
          scripts/build-core.sh --publish --sums native.sha256 \
            --target aarch64-apple-darwin --target x86_64-apple-darwin --target x86_64-unknown-linux-musl
          cat native.sha256
          [ "$(wc -l < native.sha256 | tr -d ' ')" = 3 ]

      # build-core.sh ran the arm64 binary. The x64 one runs under Rosetta
      # where the runner has it; where it does not, that is said, and the
      # binary ships built and not run. The linux binary is run by the
      # publish job, which is on Linux.
      - name: Run the darwin-x64 binary
        run: |
          set -euo pipefail
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 ./bin/native/darwin-x64/safedeps-core version
            arch -x86_64 ./bin/native/darwin-x64/safedeps-core stamp
          else
            echo "::warning::this runner cannot run x86_64 programs, so bin/native/darwin-x64/safedeps-core was built and not run"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native
          path: |
            bin/native/
            native.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Named in the trusted publisher on npmjs.com; the OIDC token carries it.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. Node 22
      # bundles npm 10, so this is Node 24 (its npm is 11.5.1 from 24.5.0).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # The binaries land where the build job had them: bin/native/ and
      # native.sha256, at the root. An artifact does not keep the exec bit, so
      # it is set again here, after the bytes are checked against the build
      # job's digests. The linux binary is run on this runner. Then the
      # package is listed the way it will be packed: each binary has to be in
      # it, nothing of rust/ may be, and it names no dependency.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native

      - name: Place and check the binaries
        run: |
          set -euo pipefail
          [ "$(wc -l < native.sha256 | tr -d ' ')" = 3 ]
          ( cd bin/native && sha256sum -c ../../native.sha256 )
          chmod 755 bin/native/*/safedeps-core
          ./bin/native/linux-x64/safedeps-core version
          stamp=$(./bin/native/linux-x64/safedeps-core stamp)
          echo "stamp: $stamp"
          [ "${stamp%% *}" = publish ] || { echo "::error::the linux-x64 binary's stamp is not a publish build's"; exit 1; }
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          for p in darwin-arm64 darwin-x64 linux-x64; do
            jq -e --arg f "bin/native/$p/safedeps-core" '.[0].files | map(.path) | index($f)' "$RUNNER_TEMP/pack.json" >/dev/null \
              || { echo "::error::npm pack does not carry bin/native/$p/safedeps-core"; exit 1; }
          done
          if jq -e '.[0].files | map(.path) | any(startswith("rust/"))' "$RUNNER_TEMP/pack.json" >/dev/null; then
            echo "::error::npm pack carries rust/ sources"
            exit 1
          fi
          deps=$(jq '(.dependencies // {}) + (.optionalDependencies // {}) + (.peerDependencies // {}) | length' package.json)
          [ "$deps" = 0 ] || { echo "::error::package.json names $deps dependencies"; exit 1; }

      - name: Check npm and the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npm_version=$(npm --version)
          echo "node $(node --version), npm $npm_version"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("::error::trusted publishing needs npm >= 11.5.1, found " + process.argv[1]);
              process.exit(1);
            }' "$npm_version"
          pkg_version=$(jq -r .version package.json)
          bin_version=$(./bin/safedeps --json version | jq -r .version)
          crate_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -n 1)
          core_version=$(./bin/native/linux-x64/safedeps-core version)
          echo "tag $TAG, package.json $pkg_version, bin/safedeps $bin_version, rust/Cargo.toml $crate_version, the binary: $core_version"
          if [ "$TAG" != "v$pkg_version" ] || [ "$bin_version" != "$pkg_version" ] \
            || [ "$crate_version" != "$pkg_version" ] || [ "$core_version" != "safedeps-core $pkg_version" ]; then
            echo "::error::tag, package.json, bin/safedeps, rust/Cargo.toml and the built binary disagree on the version"
            exit 1
          fi

      # No token: npm exchanges the job's OIDC token for a short-lived publish
      # credential. Provenance is automatic under trusted publishing; the flag
      # asks for it by name as well. The package has no dependencies and no
      # lockfile, so there is nothing to install. What is packed is this
      # working tree: the tag's files and the binaries the build job made.
      - name: Publish
        run: |
          rc=0
          npm publish --provenance || rc=$?
          if [ "$rc" != 0 ]; then
            echo "::error::npm publish failed (exit $rc). ENEEDAUTH or 403 means the trusted publisher on npmjs.com does not match this workflow (AGENTS.md, release step 10). Check npm view before rerunning: a publish that failed late can still have published."
            exit "$rc"
          fi

      # Everything below runs after npm accepted the version, and a version is
      # published once: a failure here says so, and is fixed forward in the
      # next patch, never by publishing again. So each read below that can fail
      # on what the registry or the runner answers ends in `|| unconfirmed`:
      # under set -e alone it would end the step without saying the version
      # was published. (The jq reads of $meta read JSON jq has already parsed.)
      #
      # The registry can answer 404 for a while after a publish: in v2.18.1
      # (run 37265447356) the version document answered 404 on this runner for
      # all of the five minutes the read waited. So every try asks both the
      # version document and the package document, each with a query string of
      # its own and no-cache, so a cache keyed on the URL cannot hand back an
      # earlier try's 404, and the read waits up to 20 minutes.
      - name: Read the release back from the registry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          name=$(jq -r .name package.json)
          base="https://registry.npmjs.org/${name/\//%2f}"
          unconfirmed() {
            echo "::error::$name@$version was published, but the read-back failed: $1. It cannot be published again; read 'npm view $name@$version' and fix forward in the next patch."
            exit 1
          }
          meta=""
          deadline=$(( $(date +%s) + 1200 ))
          try=0
          while [ -z "$meta" ]; do
            try=$((try + 1))
            fresh="t=$(date +%s)-$try-$RANDOM"
            # curl -w prints the status even when the request fails.
            code=$(curl -sS -o "$RUNNER_TEMP/version.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "$base/$version?$fresh" || true)
            if [ "$code" = 200 ] && jq -e --arg v "$version" '.version == $v' "$RUNNER_TEMP/version.json" >/dev/null; then
              meta=$(cat "$RUNNER_TEMP/version.json")
              echo "try $try: the version document answered"
              break
            fi
            pcode=$(curl -sS -o "$RUNNER_TEMP/package.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "$base?$fresh" || true)
            if [ "$pcode" = 200 ] && jq -e --arg v "$version" '.versions[$v]' "$RUNNER_TEMP/package.json" >/dev/null; then
              meta=$(jq --arg v "$version" '.versions[$v]' "$RUNNER_TEMP/package.json")
              echo "try $try: the package document answered (the version document said $code)"
              break
            fi
            echo "try $try: version document $code, package document $pcode without $version"
            [ "$(date +%s)" -lt "$deadline" ] || unconfirmed "neither $base/$version nor $base named $version after 20 minutes"
            sleep 20
          done
          publisher=$(jq -r '._npmUser.trustedPublisher.id // "none"' <<<"$meta")
          predicate=$(jq -r '.dist.attestations.provenance.predicateType // "none"' <<<"$meta")
          echo "trusted publisher: $publisher"
          echo "provenance: $predicate"
          if [ "$publisher" != github ] || [ "$predicate" = none ]; then
            unconfirmed "the registry does not mark it as published by GitHub with provenance"
          fi
          # The list is this working tree's, binaries in place: the tag's
          # tree alone has none.
          npm pack --dry-run --json | jq -r '.[0].files[].path' | sort > "$RUNNER_TEMP/local.txt" \
            || unconfirmed "npm pack --dry-run of this tree did not list its files"
          # The tarball named by the document read above, not
          # `npm pack <name>@<version>`: that reads the package document,
          # which the registry can update later than the version's.
          tarball_url=$(jq -r '.dist.tarball // empty' <<<"$meta")
          [ -n "$tarball_url" ] || unconfirmed "the registry names no dist.tarball"
          tarball="$RUNNER_TEMP/published.tgz"
          curl -sSfL --retry 10 --retry-delay 15 --retry-all-errors -o "$tarball" "$tarball_url" \
            || unconfirmed "$tarball_url did not download"
          tar -tzf "$tarball" | sed 's#^package/##' | sort > "$RUNNER_TEMP/published.txt" \
            || unconfirmed "the tarball from $tarball_url did not list as a gzip tar"
          if ! diff -u "$RUNNER_TEMP/local.txt" "$RUNNER_TEMP/published.txt"; then
            unconfirmed "the published file list differs from npm pack --dry-run of this tree"
          fi
          echo "published file list matches this tree ($(wc -l < "$RUNNER_TEMP/published.txt") files)"
          # The binaries as the registry serves them: each keeps its exec bit,
          # each is byte for byte the one the build job made, and the one this
          # runner can run says the version that was published.
          for p in darwin-arm64 darwin-x64 linux-x64; do
            tar -tvzf "$tarball" "package/bin/native/$p/safedeps-core" | grep -q '^-rwxr-xr-x' \
              || unconfirmed "bin/native/$p/safedeps-core in the published tarball is not mode 755"
          done
          mkdir -p "$RUNNER_TEMP/published"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/published" || unconfirmed "the published tarball did not unpack"
          ( cd "$RUNNER_TEMP/published/package/bin/native" && sha256sum -c "$GITHUB_WORKSPACE/native.sha256" ) \
            || unconfirmed "a published binary is not the bytes the build job made"
          served=$("$RUNNER_TEMP/published/package/bin/native/linux-x64/safedeps-core" version) \
            || unconfirmed "the published linux-x64 binary does not run"
          [ "$served" = "safedeps-core $version" ] \
            || unconfirmed "the published linux-x64 binary says '$served', not safedeps-core $version"
          echo "published binaries: mode 755, the build job's bytes, and $served"
